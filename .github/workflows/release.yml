# Release workflow.
#
# THE SHARED SDK LINE: @ekoindia/eps-sdk (npm), ekoindia/eps-sdk (Packagist),
#   eps-sdk (PyPI) and eps-sdk-go all ship at ONE version, so a developer
#   comparing two languages sees the same number. scripts/sdk-release.mjs
#   fingerprints the four packages plus the baked surface, compares against the
#   fingerprint stored in the newest vX.Y.Z tag, and only then does the
#   sdk-version job hand a version to the publish jobs. The tag is written LAST,
#   by sdk-tag, once every publish succeeded — a failed release records no
#   fingerprint, so the next push retries instead of skipping.
#
#   Why the publishes hang off `needs` rather than a tag event: a tag pushed
#   with GITHUB_TOKEN does not trigger workflow runs, so an auto-created tag
#   could never start a second run. Pushing a vX.Y.Z tag BY HAND still works and
#   forces a release at that exact version.
#
# npm tool packages: AUTO-released on every push to `main`. scripts/auto-release.mjs
#   builds each package, fingerprints the exact files npm would publish, and
#   publishes a patch bump ONLY when that content differs from what's already on
#   npm — so unaffected packages are skipped. To force a minor/major, bump the
#   package's package.json `version` above the npm latest before merging; the
#   script honors it. Releases are tag-traceable via `<name>@<version>` git tags
#   (no commit is pushed back to the protected branch — the registry is the
#   source of truth). See docs/releasing-agent-packages.md.
#
# Git-tag-published SDKs (PHP and Go, later Java): each is subtree-split into its own
#   read-only mirror repo, where the tag IS the release — Packagist watches the
#   mirror, the Go module proxy reads the tag, JitPack builds from it. No
#   registry account and no publish token for any of them, only push access to
#   the mirrors.
#
# Python SDK: pypi-release writes the shared version into pyproject.toml before
#   building. `skip-existing` keeps a re-run a no-op, since PyPI versions are
#   immutable.
#
# Node.js SDK: npm-sdk-release publishes @ekoindia/eps-sdk at the shared version
#   too — it is deliberately NOT in auto-release.mjs's list any more, because
#   per-package auto-patching would drift it away from the other three.
#
# npm auth: OIDC Trusted Publishing (see docs/releasing-agent-packages.md §2).
#   Each @ekoindia/* package has a Trusted Publisher configured on npmjs.com for
#   this repo + workflow, so the `npm-release` job's `id-token: write` (granted
#   job-level below) authenticates publishes with no token — provenance is
#   automatic. The bootstrap NPM_TOKEN secret has been removed.
#
# Required repository secrets:
#   SDK_SPLIT_TOKEN    Fine-grained PAT with Contents:write on every SDK mirror
#                      repo (ekoindia/eps-sdk-php, -go, -java). ONE token for all
#                      of them — the default GITHUB_TOKEN cannot push to another
#                      repository. Fine-grained, Contents:write, mirrors only.

name: Release

on:
  push:
    branches: [main] # npm-release (content-gated)
    tags: ["v*.*.*"] # every SDK release: sdk-split + pypi-release
  workflow_dispatch: {} # manual npm-release override

# Serialize releases so two pushes can't publish/tag concurrently.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm-release:
    name: Release npm tool packages
    # Branch push or manual dispatch only — never on the vX.Y.Z tag (that's PHP).
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push <name>@<version> git tags
      id-token: write # OIDC Trusted Publishing (scoped to this job, not php-split)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags so the script can check existing tags

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          registry-url: https://registry.npmjs.org

      # Node 22.14.0 bundles npm 10.9.2, which CANNOT do OIDC Trusted Publishing
      # (npm exchanges the GitHub id-token for a registry token only on >=11.5.1).
      # Without this, `npm publish` runs unauthenticated and fails with E404.
      - name: Upgrade npm for OIDC Trusted Publishing (needs >= 11.5.1)
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      # Repo-root build emits dist/agent/*.json that each package bakes from.
      - name: Build agent bundles
        run: npm run build

      # Test gate — never publish a broken build. Mirrors the CI package tests.
      - name: Test packages
        run: |
          npm test -w @ekoindia/eps-context-mcp
          npm test -w @ekoindia/eps-sdk
          npm test -w @ekoindia/eps-mock-server
          # transact:test builds the @ekoindia/eps-sdk dist first — transact-mcp
          # imports it via package main (dist/), unlike the src-only siblings.
          npm run transact:test

      - name: Configure git (for release tags)
        run: |
          git config user.name  "eko-ci"
          git config user.email "ci@eko.in"

      # Authenticated via each package's npm Trusted Publisher (OIDC) — no token.
      - name: Auto-release changed packages
        run: |
          node scripts/auto-release.mjs \
            packages/eps-context-mcp \
            packages/eps-mock-server \
            packages/eps-transact-mcp

  # Decides the one version every SDK publishes at in this run, and whether
  # there is anything to publish at all.
  sdk-version:
    name: Resolve SDK version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      release: ${{ steps.resolve.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags: the gate reads the newest vX.Y.Z

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"

      - name: Install dependencies
        run: npm ci

      # The gate fingerprints dist/agent/sdk-surface.json, so it has to exist.
      - name: Build agent bundles
        run: npm run build

      - name: Resolve version
        id: resolve
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # Hand-cut tag: an explicit instruction to release exactly this.
            version="${GITHUB_REF_NAME#v}"
            echo "manual tag $GITHUB_REF_NAME -> $version"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            plan="$(node scripts/sdk-release.mjs plan)"
            echo "$plan"
            echo "version=$(echo "$plan" | jq -r .version)" >> "$GITHUB_OUTPUT"
            echo "release=$(echo "$plan" | jq -r .changed)" >> "$GITHUB_OUTPUT"
          fi

  npm-sdk-release:
    name: Release Node.js SDK
    needs: sdk-version
    if: needs.sdk-version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC Trusted Publishing — no token
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          registry-url: https://registry.npmjs.org

      # OIDC Trusted Publishing needs npm >= 11.5.1; Node 22.14.0 ships 10.9.2.
      - name: Upgrade npm for OIDC Trusted Publishing (needs >= 11.5.1)
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Build agent bundles
        run: npm run build

      # The tag is the version for every SDK; npm records it in package.json.
      - name: Set version from the shared SDK version
        run: npm pkg set version="${{ needs.sdk-version.outputs.version }}"
        working-directory: packages/sdk-js

      - name: Test
        run: npm test -w @ekoindia/eps-sdk

      - name: Build package
        run: npm run build -w @ekoindia/eps-sdk

      # Idempotent: a re-run of an already-published version is a no-op rather
      # than a red build. npm versions, like PyPI's, cannot be replaced.
      # --ignore-scripts because the bake + build above already ran.
      - name: Publish to npm
        working-directory: packages/sdk-js
        run: |
          version="${{ needs.sdk-version.outputs.version }}"
          if npm view "@ekoindia/eps-sdk@$version" version >/dev/null 2>&1; then
            echo "@ekoindia/eps-sdk@$version already published — skipping"
            exit 0
          fi
          npm publish --provenance --access public --ignore-scripts

  sdk-split:
    name: Split + publish ${{ matrix.label }} SDK
    # Splitting a row whose sources did not change is harmless — the mirror just
    # gets another tag pointing at identical content — so every row goes on each
    # release of the shared line.
    needs: sdk-version
    if: needs.sdk-version.outputs.release == 'true'
    runs-on: ubuntu-latest
    # Needs the SDK_SPLIT_TOKEN secret + the mirror repo for the row. A package
    # manager cannot install from a monorepo subdirectory, hence the read-only
    # split mirrors. Third-party actions here are SHA-pinned: this job holds a
    # write-capable PAT, and a mutable tag would let it move under us.
    strategy:
      fail-fast: false # one language's failure must not cancel the others
      matrix:
        include:
          # `test` runs in `dir`. A row may pin its toolchain (`php-version`
          # here); rows that leave it unset use the stock ubuntu-latest image
          # (Go and Temurin JDK are preinstalled).
          # `composer validate --strict` is part of the gate: green tests say
          # nothing about whether Packagist will accept the manifest.
          - label: PHP
            dir: packages/sdk-php
            mirror: eps-sdk-php
            php-version: "8.1" # the floor composer.json declares — not whatever the image ships
            test: composer validate --strict && composer install --no-interaction --no-progress && vendor/bin/phpunit --bootstrap vendor/autoload.php tests
          # Go needs no registry at all: proxy.golang.org serves the mirror's
          # tag directly. The module path in go.mod is compiled in, so the
          # mirror must stay at github.com/ekoindia/eps-sdk-go.
          - label: Go
            dir: packages/sdk-go
            mirror: eps-sdk-go
            go-version: "1.22" # the floor go.mod declares — not whatever the image ships
            test: test -z "$(gofmt -l .)" && go vet ./... && go test ./...
    steps:
      # Fail in seconds on a missing/scoped-wrong token instead of after the
      # full build + test, with the split step as the first thing that notices.
      - name: Preflight — mirror push credentials
        env:
          SDK_SPLIT_TOKEN: ${{ secrets.SDK_SPLIT_TOKEN }}
        run: |
          if [ -z "$SDK_SPLIT_TOKEN" ]; then
            echo "::error::SDK_SPLIT_TOKEN is not set — see docs/releasing-agent-packages.md §2"
            exit 1
          fi
          if ! curl -sf -o /dev/null -H "Authorization: Bearer $SDK_SPLIT_TOKEN" \
               "https://api.github.com/repos/ekoindia/${{ matrix.mirror }}"; then
            echo "::error::SDK_SPLIT_TOKEN cannot reach ekoindia/${{ matrix.mirror }} (missing repo, or token not scoped to it)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"

      # Rows without `php-version` skip this.
      - name: Setup PHP ${{ matrix.php-version }}
        if: matrix.php-version
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2

      # Rows without `go-version` skip this.
      - name: Setup Go ${{ matrix.go-version }}
        if: matrix.go-version
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: false # stdlib only — no modules to cache, and no go.sum exists

      - name: Install dependencies
        run: npm ci

      # The runtime asset data/sdk-surface.json is generated + gitignored. The
      # subtree split only carries COMMITTED files, so bake it and commit it into
      # this ephemeral checkout before splitting — otherwise the mirror ships
      # without the surface and the client fails at runtime.
      - name: Bake + commit SDK surface
        run: |
          npm run build
          git config user.name  "eko-ci"
          git config user.email "ci@eko.in"
          git add -f ${{ matrix.dir }}/data/sdk-surface.json
          git commit -m "chore(${{ matrix.mirror }}): bake surface for split [skip ci]"

      # What consumers install is the DIST ARCHIVE, not the repo tree: the baked
      # surface must be in it and `.gitattributes` export-ignore must have kept
      # tests out. Asserting that here beats finding out from a broken install.
      - name: Verify publishable archive
        run: |
          git archive --format=tar "HEAD:${{ matrix.dir }}" > /tmp/split-archive.tar
          if ! tar tf /tmp/split-archive.tar | grep -qx 'data/sdk-surface.json'; then
            echo "::error::data/sdk-surface.json missing from the archive — the bake step did not commit it"
            exit 1
          fi
          if tar tf /tmp/split-archive.tar | grep -q '^tests/'; then
            echo "::error::tests/ leaked into the archive — check ${{ matrix.dir }}/.gitattributes export-ignore"
            exit 1
          fi

      # Release gate. The matching ci.yml job is deliberately excluded from the
      # required `ci-ok` check, and a tag can be cut from any commit, so the
      # tests are re-run here against exactly what is about to be published.
      - name: Test ${{ matrix.label }} SDK
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.test }}

      # Pushes `branch` (default `main`, creating it on an empty mirror) and the
      # tag — so a first release leaves the mirror with both.
      - name: Split ${{ matrix.dir }} to ekoindia/${{ matrix.mirror }}
        uses: symplify/monorepo-split-github-action@ac9845270ef47266435b4f124b133a323619e738 # v2.3.0
        env:
          # The action reads GITHUB_TOKEN; the value is the mirror PAT, because
          # the default GITHUB_TOKEN cannot push to another repository.
          GITHUB_TOKEN: ${{ secrets.SDK_SPLIT_TOKEN }}
        with:
          package_directory: ${{ matrix.dir }}
          repository_organization: ekoindia
          repository_name: ${{ matrix.mirror }}
          user_name: "eko-ci"
          user_email: "ci@eko.in"
          # The mirror's tag IS its release, for Packagist and the Go proxy alike.
          tag: v${{ needs.sdk-version.outputs.version }}

  pypi-release:
    name: Release Python SDK
    needs: sdk-version
    if: needs.sdk-version.outputs.release == 'true'
    runs-on: ubuntu-latest
    # PyPI Trusted Publishing binds to repo + workflow + environment, so the
    # environment name below must match the one configured on pypi.org.
    environment: pypi
    permissions:
      id-token: write # OIDC Trusted Publishing — no API token
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"

      - name: Install dependencies
        working-directory: .
        run: npm ci

      # Emits dist/agent/sdk-surface.json and bakes it into every SDK package.
      - name: Build agent bundles
        working-directory: .
        run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The tag is the version for every SDK. Packagist and the Go module proxy
      # read it straight from git; a Python wheel carries its version inside the
      # artifact, so it has to be written into the manifest before the build.
      # pyproject.toml therefore holds a placeholder, never a real version to
      # keep in sync.
      - name: Set version from the shared SDK version
        run: |
          version="${{ needs.sdk-version.outputs.version }}"
          sed -i "s/^version = .*/version = \"$version\"/" pyproject.toml
          grep -qx "version = \"$version\"" pyproject.toml
          echo "building eps-sdk $version"

      # Release gate — the ci.yml python-sdk job is deliberately non-blocking,
      # and a tag can be cut from any commit, so re-run against what ships.
      - name: Run conformance suite
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build

      # The wheel must carry the baked surface (force-include in pyproject.toml)
      # or the installed client raises "EPS SDK surface not found".
      - name: Verify the wheel ships the SDK surface
        run: |
          python - <<'EOF'
          import glob, zipfile, sys
          wheel = glob.glob("dist/*.whl")[0]
          if "eps_sdk/data/sdk-surface.json" not in zipfile.ZipFile(wheel).namelist():
              sys.exit(f"{wheel} is missing eps_sdk/data/sdk-surface.json")
          print(f"ok: {wheel} ships the SDK surface")
          EOF

      # skip-existing: a re-run of an already-published tag (or a tag cut when
      # the Python SDK did not change) must be a no-op, not a red build — PyPI
      # versions are immutable and cannot be overwritten.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/sdk-python/dist
          skip-existing: true

  # Written LAST, and only when every publish succeeded: the tag carries the
  # content fingerprint the next run compares against, so recording it after a
  # failure would make the retry think there was nothing to release.
  # Skipped for a hand-cut tag, which already exists.
  sdk-tag:
    name: Tag the SDK release
    needs: [sdk-version, npm-sdk-release, sdk-split, pypi-release]
    if: needs.sdk-version.outputs.release == 'true' && github.ref_type != 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the vX.Y.Z tag
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"

      - name: Install dependencies
        run: npm ci

      # Must fingerprint the same built surface the gate did.
      - name: Build agent bundles
        run: npm run build

      - name: Tag
        run: |
          git config user.name  "eko-ci"
          git config user.email "ci@eko.in"
          node scripts/sdk-release.mjs tag "${{ needs.sdk-version.outputs.version }}"
