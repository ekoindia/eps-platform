name: CI

# Only `main` pushes are built directly — a main push run's completion is what
# triggers the workflow_run deploys (deploy-eps-backend.yml,
# deploy-eps-transact-mcp.yml). dev/feature branches are covered by their PR
# run; building them on push too produced a duplicate, identical run AND made
# back-to-back dev pushes queue behind each other on the concurrency group
# below (observed: 4m28s of pure wait before the first job even started).
on:
  pull_request:
  push:
    branches:
      - main

# Cancel superseded PR runs only. Push runs on main are NOT cancelled — a
# main push run's completion triggers the workflow_run deploys; cancelling it
# would drop a deploy.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The heavy work is fanned out across independent jobs that run concurrently.
# Each pays ~25s of checkout + setup-node + `npm ci`, which is far cheaper than
# the serial chain it replaces. `ci-ok` at the bottom is the single required
# status check — add or rename jobs freely, branch protection never changes.
#
# Job-level `if:` (not step-level) is deliberate: a skipped job never boots its
# runner or its service containers, so a docs-only change costs nothing.
jobs:
  # Lightweight path detection. Every job below gates on these outputs.
  # `code` is a deliberate SUPERSET of every specific filter, so
  # `php|transact|poller|backend == true` implies `code == true` (php-sdk
  # relies on this — see its job).
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.f.outputs.code }}
      php: ${{ steps.f.outputs.php }}
      python: ${{ steps.f.outputs.python }}
      go: ${{ steps.f.outputs.go }}
      java: ${{ steps.f.outputs.java }}
      poller: ${{ steps.f.outputs.poller }}
      transact: ${{ steps.f.outputs.transact }}
      backend: ${{ steps.f.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # paths-filter needs history to diff before..after on push

      # Lives here, not on a gated job: bun.lock matches no path filter, so a
      # commit adding one alone would skip every gated job and never be caught.
      - name: Enforce npm (no Bun lockfiles)
        run: |
          if git ls-files --error-unmatch bun.lock bun.lockb 2>/dev/null; then
            echo "::error::Bun lockfile committed. This project standardizes on npm — remove bun.lock/bun.lockb."
            exit 1
          fi

      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            # SUPERSET — keep every other filter's paths a subset of these so a
            # match anywhere guarantees code==true (php-sdk's sdk-surface
            # artifact dependency relies on the build job having run).
            code:
              - 'src/**'
              - 'packages/**'
              - 'ssg/**'
              - 'scripts/**'
              - '.githooks/**'
              - 'index.html'
              - 'vite.config.ts'
              - 'vitest.config.ts'
              - 'vite-plugin-*.ts'
              - 'tsconfig*.json'
              - 'eslint.config.*'
              - 'package.json'
              - 'package-lock.json'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
            # php ⊂ code (invariant — do not add a path here that isn't in code).
            php:
              - 'packages/sdk-php/**'
              - 'src/**' # sdk-surface derives from the SSOT in src/lib/data
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            # python ⊂ code (invariant — do not add a path here that isn't in code).
            python:
              - 'packages/sdk-python/**'
              - 'src/**' # sdk-surface derives from the SSOT in src/lib/data
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            # go ⊂ code (invariant — do not add a path here that isn't in code).
            go:
              - 'packages/sdk-go/**'
              - 'src/**' # sdk-surface derives from the SSOT in src/lib/data
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            # java ⊂ code (invariant — do not add a path here that isn't in code).
            java:
              - 'packages/sdk-java/**'
              - 'src/**' # sdk-surface derives from the SSOT in src/lib/data
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            poller:
              - 'packages/eps-backend/deploy/poller/**'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
            # AGGRESSIVE: no bare src/** — the image smoke only needs to re-run
            # when the Dockerfile/manifests/deps change; bundle-content
            # correctness is covered by the package vitest in test-packages.
            transact:
              - 'packages/eps-transact-mcp/**'
              - 'packages/sdk-js/**'
              - '.githooks/setup.mjs'
              - 'package-lock.json'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
            backend:
              - 'packages/eps-backend/**'
              - 'packages/eps-context-mcp/**'
              - '.githooks/setup.mjs'
              - 'package-lock.json'
              - '.dockerignore'
              - '.github/workflows/ci.yml'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  # The website test suite needs NO build output — verified: all 101 test files
  # pass with neither dist/ nor packages/*/data present. Keeping `vite build`
  # off this job is what makes it the (short) critical path.
  test-web:
    name: Test website
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Test website
        run: npx vitest run

  # Build + the package suites are ONE job because they are genuinely coupled:
  # every bake script reads dist/agent/*.json, so `bake:all` (and therefore the
  # eps-context-mcp / eps-sdk / eps-transact-mcp suites) hard-depends on
  # `vite build`. Splitting them would mean either a second `vite build` in
  # another runner or an artifact hand-off that re-serializes the two.
  build-and-test-packages:
    name: Build + package tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    services:
      # Real RESP store for the eps-backend KV contract + fail-closed
      # integration tests (src/store/redis.test.ts). They self-skip unless
      # REDIS_TEST_URL is set, so this service is what makes them actually run
      # in CI. Valkey (FOSS Redis fork) matches the image the prod compose
      # stack runs and satisfies the >=6.2 GETDEL/Lua floor the backend needs.
      # Scoped to this job only — service containers boot before any step-level
      # `if`, so keeping it off the other jobs is what saves their ~16s init.
      redis:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Proves the website actually builds AND produces dist/agent/*.json, which
      # `bake:all` copies into each package's data/ dir. Required by the
      # eps-context-mcp / eps-sdk / eps-transact-mcp suites below.
      - name: Build (website + agent bundles)
        run: npm run build

      # The SDK surface is baked here (gitignored, not committed). Hand it to
      # the php-sdk job as an artifact so PHP tests get the runtime asset
      # without a Node toolchain. Generic name — future SDK jobs reuse it.
      - name: Upload baked SDK surface
        uses: actions/upload-artifact@v4
        with:
          name: sdk-surface
          path: packages/sdk-php/data/sdk-surface.json
          if-no-files-found: error
          retention-days: 7

      - name: Test eps-context-mcp
        run: npm test -w @ekoindia/eps-context-mcp

      - name: Test eps-sdk (Node.js)
        run: npm test -w @ekoindia/eps-sdk

      # transact-mcp imports @ekoindia/eps-sdk via its package main (dist/), so
      # the SDK must be tsup-built first — `transact:test` does that itself.
      - name: Test eps-transact-mcp
        run: npm run transact:test

      - name: Test eps-mock-server
        run: npm test -w @ekoindia/eps-mock-server

      - name: Test eps-backend (incl. Redis integration)
        run: npm test -w @ekoindia/eps-backend
        env:
          # Flips src/store/redis.test.ts from skip -> run against the `redis`
          # service container above. Without this the backend suite still runs,
          # but the Redis adapter (Lua incr, GETDEL, fail-closed) stays unproven.
          REDIS_TEST_URL: redis://localhost:6379

      - name: Shellcheck deploy scripts
        run: |
          shellcheck packages/eps-backend/deploy/poller/poll.sh \
                     packages/eps-backend/deploy/health.sh

      - name: Test eps-backend poller (bash shim harness)
        run: npm run test:poller -w @ekoindia/eps-backend

  # Compose validations and image builds gate on their own package filters.
  # Each `docker build` runs its own `npm ci` INSIDE the image, so no job
  # dependency is needed for dependencies — but the transact image also COPYs
  # gitignored baked data OUT OF the build context, so this job bakes that
  # itself (see the Setup Node/Build steps below). An earlier version of this
  # comment claimed the images needed nothing from a build step at all; that
  # was true of npm install and false of the baked data, and it broke the
  # transact image when this job was split onto its own runner.
  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.transact == 'true' ||
      needs.changes.outputs.poller == 'true'
    steps:
      - uses: actions/checkout@v4

      # A well-formed 64-hex digest (sha256:0 fails digest-format).
      - name: Validate eps-backend prod compose
        if: needs.changes.outputs.backend == 'true'
        working-directory: packages/eps-backend
        run: |
          d=$(printf '0%.0s' $(seq 64))
          printf 'EPS_BACKEND_IMAGE=ghcr.io/ekoindia/eps-backend@sha256:%s\n' "$d" > deploy.env
          : > .env
          docker compose -p eps-backend --project-directory . \
            --env-file deploy.env -f docker-compose.prod.yml config -q
          rm -f deploy.env .env

      # NB: no `.env` written here — the standalone transact compose drops
      # `env_file: .env`, so a bare bring-up with only the image pin must validate.
      - name: Validate eps-transact-mcp standalone compose
        if: needs.changes.outputs.transact == 'true'
        working-directory: packages/eps-transact-mcp/deploy
        run: |
          d=$(printf '0%.0s' $(seq 64))
          printf 'EPS_TRANSACT_MCP_IMAGE=ghcr.io/ekoindia/eps-transact-mcp@sha256:%s\n' "$d" > deploy.env
          docker compose -p eps-transact-mcp --project-directory . \
            --env-file deploy.env -f docker-compose.prod.yml config -q
          rm -f deploy.env

      # The transact image COPYs packages/{sdk-js,eps-transact-mcp}/data into the
      # build context — both gitignored, both produced by the root `vite build` +
      # `bake:all`. See the prerequisite note atop packages/eps-transact-mcp/Dockerfile.
      # Only the transact image needs this: the poller image builds from its own
      # self-contained context and the compose validations read no baked data.
      - name: Setup Node.js
        if: needs.changes.outputs.transact == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: needs.changes.outputs.transact == 'true'
        run: npm ci

      - name: Build (bakes packages/*/data into the image build context)
        if: needs.changes.outputs.transact == 'true'
        run: npm run build

      # Fail loudly and precisely here rather than as an opaque BuildKit
      # "failed to calculate checksum ... not found" three steps later, if the
      # build ever stops emitting these.
      - name: Assert baked data present
        if: needs.changes.outputs.transact == 'true'
        run: |
          for f in packages/sdk-js/data/sdk-surface.json \
                   packages/eps-transact-mcp/data/eps.json; do
            if [ ! -s "$f" ]; then
              echo "::error::$f missing or empty after 'npm run build' — the transact image COPYs it from the build context."
              exit 1
            fi
          done

      # buildx is required for the GHA layer cache below; the default docker
      # driver cannot export cache.
      - name: Set up Buildx
        if: needs.changes.outputs.poller == 'true' || needs.changes.outputs.transact == 'true'
        uses: docker/setup-buildx-action@v3

      # The shared poller image (consumed by the transact stack; eps-backend
      # build:s the same Dockerfile) must build — catch a broken image before
      # any stack depends on it. Distinct cache scope: a shared scope would let
      # the two images thrash each other's layers.
      - name: Build shared poller image
        if: needs.changes.outputs.poller == 'true'
        uses: docker/build-push-action@v6
        with:
          context: packages/eps-backend/deploy/poller
          load: true
          push: false
          tags: eps-poller-ci:latest
          cache-from: type=gha,scope=poller
          cache-to: type=gha,mode=max,scope=poller

      # Container smoke for the transactional MCP: the build exercises the risky
      # parts (workspace resolution, baked-data copy); then prove /healthz answers.
      - name: Build eps-transact-mcp image
        if: needs.changes.outputs.transact == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/eps-transact-mcp/Dockerfile
          load: true
          push: false
          tags: eps-transact-mcp-ci:latest
          cache-from: type=gha,scope=transact
          cache-to: type=gha,mode=max,scope=transact

      - name: Smoke eps-transact-mcp image
        if: needs.changes.outputs.transact == 'true'
        run: |
          cid=$(docker run -d -p 8788:8788 eps-transact-mcp-ci:latest)
          ok=""
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8788/healthz > /dev/null; then ok=1; break; fi
            sleep 1
          done
          docker logs "$cid"
          docker rm -f "$cid"
          [ "$ok" = "1" ]

  php-sdk:
    name: PHP SDK
    runs-on: ubuntu-latest
    # Needs `build-and-test-packages` to receive its baked sdk-surface artifact
    # (the PHP runner never runs the website build). Safe because php ⊂ code, so
    # when php==true that job ran and produced the artifact.
    needs: [changes, build-and-test-packages]
    if: needs.changes.outputs.php == 'true'
    defaults:
      run:
        working-directory: packages/sdk-php
    steps:
      - uses: actions/checkout@v4

      # data/sdk-surface.json is generated (gitignored), not committed.
      - name: Download baked SDK surface
        uses: actions/download-artifact@v4
        with:
          name: sdk-surface
          path: packages/sdk-php/data

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      # No phpunit.xml is present, so point phpunit at the tests directory and
      # bootstrap Composer's autoloader explicitly.
      - name: Run PHPUnit
        run: vendor/bin/phpunit --bootstrap vendor/autoload.php tests

  python-sdk:
    name: Python SDK
    runs-on: ubuntu-latest
    # Same shape as php-sdk: needs the baked sdk-surface artifact from
    # build-and-test-packages, safe because python ⊂ code.
    needs: [changes, build-and-test-packages]
    if: needs.changes.outputs.python == 'true'
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - uses: actions/checkout@v4

      # data/sdk-surface.json is generated (gitignored), not committed.
      - name: Download baked SDK surface
        uses: actions/download-artifact@v4
        with:
          name: sdk-surface
          path: packages/sdk-python/data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9" # the floor in pyproject.toml

      # Stdlib only — no install step, no dependencies to resolve.
      - name: Run conformance suite
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      # Packaging guard: the wheel must carry the surface (force-include in
      # pyproject.toml). Without it `pip install` yields a client that raises
      # "EPS SDK surface not found" on the first call.
      - name: Build wheel and verify it ships the surface
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
          python - <<'EOF'
          import glob, zipfile, sys
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          if "eps_sdk/data/sdk-surface.json" not in names:
              sys.exit(f"{wheel} is missing eps_sdk/data/sdk-surface.json")
          print(f"ok: {wheel} ships the SDK surface")
          EOF

  go-sdk:
    name: Go SDK
    runs-on: ubuntu-latest
    # Same shape as php-sdk/python-sdk: needs the baked sdk-surface artifact
    # from build-and-test-packages, safe because go ⊂ code.
    needs: [changes, build-and-test-packages]
    if: needs.changes.outputs.go == 'true'
    defaults:
      run:
        working-directory: packages/sdk-go
    steps:
      - uses: actions/checkout@v4

      # data/sdk-surface.json is generated (gitignored), not committed — and Go
      # embeds it at COMPILE time, so without this the package does not build.
      - name: Download baked SDK surface
        uses: actions/download-artifact@v4
        with:
          name: sdk-surface
          path: packages/sdk-go/data

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22" # the floor in go.mod
          cache: false # stdlib only — no modules to cache, and no go.sum exists

      - name: Verify formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - run: go vet ./...

      # Stdlib only — no modules to download.
      - name: Run conformance suite
        run: go test -v ./...

  java-sdk:
    name: Java SDK
    runs-on: ubuntu-latest
    # Same shape as the other SDK jobs: needs the baked sdk-surface artifact
    # from build-and-test-packages, safe because java ⊂ code.
    needs: [changes, build-and-test-packages]
    if: needs.changes.outputs.java == 'true'
    defaults:
      run:
        working-directory: packages/sdk-java
    steps:
      - uses: actions/checkout@v4

      # data/sdk-surface.json is generated (gitignored); the pom packages it
      # from data/ into the jar, so without this the tests cannot load it.
      - name: Download baked SDK surface
        uses: actions/download-artifact@v4
        with:
          name: sdk-surface
          path: packages/sdk-java/data

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17" # matches jitpack.yml and the pom's release level
          cache: maven

      - name: Run conformance suite
        run: mvn -B --no-transfer-progress test

  # THE required status check. Every other job is intentionally skippable via a
  # path filter, so this one aggregates them: it always runs, and it is the only
  # name branch protection needs to know about.
  #
  # `php-sdk`, `python-sdk`, `go-sdk` and `java-sdk` are deliberately NOT in `needs` — they stay
  # independent, non-blocking checks so a non-JS SDK failure never blocks the
  # dev → main merge that gates the npm release (see
  # docs/releasing-agent-packages.md §5). Leaving them out also keeps this gate
  # from waiting on their build dependency. They are not a release loophole:
  # every SDK release job re-runs its own tests before publishing.
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - lint
      - typecheck
      - test-web
      - build-and-test-packages
      - docker
    steps:
      - name: Verify no job failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          CHANGES: ${{ needs.changes.result }}
        run: |
          echo "job results: $RESULTS"
          # `changes` gates every other job, so if it fails they all report
          # 'skipped' — which is otherwise an accepted result. Assert it
          # explicitly so a broken gate can never pass the whole pipeline.
          if [ "$CHANGES" != "success" ]; then
            echo "::error::Detect changes did not succeed (result: $CHANGES)"
            exit 1
          fi
          # 'skipped' is accepted: it only comes from the deliberate path-filter
          # gates above. Anything else (failure, cancelled) fails the run.
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::A required job reported '$result'"
                exit 1
                ;;
            esac
          done
          echo "All required jobs passed or were intentionally skipped."
