# PPI product merge: Levin + DigiKhata collapsed into one PPI Wallet product.
[[redirects]]
  from = "/products/ppi-levin-api"
  to = "/products/ppi-api"
  status = 301
  force = true

[[redirects]]
  from = "/products/ppi-digikhata-api"
  to = "/products/ppi-api"
  status = 301
  force = true

# Endpoint docs slug migrations (master-nomenclature alignment).
# Renamed DMT-Fino eKYC/OTP specs + removed duplicate aadhaar-dmt-fino-* pages
# redirect to their canonical /docs slugs so external links keep resolving.
[[redirects]]
  from = "/docs/dmt-sender-ekyc"
  to = "/docs/dmt-fino-sender-ekyc"
  status = 301
  force = true

[[redirects]]
  from = "/docs/dmt-validate-ekyc-otp"
  to = "/docs/dmt-fino-validate-ekyc-otp"
  status = 301
  force = true

[[redirects]]
  from = "/docs/aadhaar-dmt-fino-ekyc"
  to = "/docs/dmt-fino-sender-ekyc"
  status = 301
  force = true

[[redirects]]
  from = "/docs/aadhaar-dmt-fino-verify-otp"
  to = "/docs/dmt-fino-validate-ekyc-otp"
  status = 301
  force = true

# DMT recipe disambiguated to its Fino variant — id/slug renamed.
[[redirects]]
  from = "/recipe/dmt-send-money"
  to = "/recipe/dmt-fino-send-money"
  status = 301
  force = true

[[redirects]]
  from = "/recipe/dmt-send-money.md"
  to = "/recipe/dmt-fino-send-money.md"
  status = 301
  force = true

# Quickstart guide folded into the /docs overview (now the quickstart itself).
[[redirects]]
  from = "/docs/quickstart"
  to = "/docs"
  status = 301
  force = true

# Missing hashed assets (stale chunks after a redeploy) must 404,
# not serve the SPA shell as HTML with a 200.
[[redirects]]
  from = "/assets/*"
  to = "/__spa-fallback.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/__spa-fallback.html"
  status = 200

# Sample partner agreement: noindex, but deliberately still fetchable (no
# robots.txt Disallow) so an AI agent handed the URL can read and explain it.
# The header also covers the .md twin, which carries no HTML meta of its own.
[[headers]]
  for = "/samples/partner-agreement"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/samples/partner-agreement.md"
  [headers.values]
    X-Robots-Tag = "noindex"

# Auth-gated internal routes must never be indexed. public/robots.txt already
# Disallows them; these headers cover bots that ignore robots.txt, which would
# otherwise get a 200 SPA shell carrying no robots meta until JS runs.
[[headers]]
  for = "/console"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/console/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
