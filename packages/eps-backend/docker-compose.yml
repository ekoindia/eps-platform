# Self-hosted Valkey (FOSS Redis fork, RESP-compatible) + eps-backend.
# Run from the repo ROOT:
#   docker compose -f packages/eps-backend/docker-compose.yml up --build
services:
  # Service stays named "redis" so REDIS_URL and the deploy poller need no
  # change. Valkey 8 loads Redis 7 AOF/RDB data in place, but the upgrade is
  # one-way: back up the eps-redis-data volume before switching if the data
  # matters (worst case here is a mass re-login — tokens and counters only).
  redis:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - eps-redis-data:/data
    networks:
      - eps-internal
    restart: unless-stopped

  eps-backend:
    build:
      # Dockerfile copies root package.json/lock + packages/eps-backend tree,
      # so the build context MUST be the repo root.
      context: ../..
      dockerfile: packages/eps-backend/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379
      # KV_ENCRYPTION_KEY must be provided (32-byte base64). Supply via an
      # .env file or your orchestrator's secret store; do not commit it.
      KV_ENCRYPTION_KEY: ${KV_ENCRYPTION_KEY}
    depends_on:
      - redis
    networks:
      - eps-internal
    restart: unless-stopped
    # Publish behind your reverse proxy; example:
    # ports:
    #   - "8787:8787"

volumes:
  eps-redis-data:

networks:
  eps-internal:
    internal: true
